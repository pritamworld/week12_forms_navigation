<div class="min-h-screen flex flex-col items-center justify-center bg-gray-100 px-4">

  <div class="text-center">

    <!-- 404 Title -->
    <h1 class="text-7xl font-extrabold text-blue-500 mb-4">
      404
    </h1>

    <!-- Message -->
    <h2 class="text-2xl font-semibold text-gray-700 mb-2">
      Page Not Found
    </h2>

    <p class="text-gray-500 mb-6">
      The page you are looking for doesn’t exist or has been moved.
    </p>

    <!-- Optional condition example -->
    @if(showTip){
    <p class="text-sm text-gray-400 mb-4">
      Tip: Check the URL or go back to homepage.
    </p>
    }

    <!-- Buttons -->
    <div class="flex gap-4 justify-center">

      <button routerLink="/" class="bg-blue-500 text-white px-5 py-2 rounded-lg hover:bg-blue-600 transition">
        Go Home
      </button>

      <button (click)="goBack()" class="bg-gray-300 text-gray-700 px-5 py-2 rounded-lg hover:bg-gray-400 transition">
        Go Back
      </button>

    </div>

  </div>

</div>
