<div class="min-h-screen flex items-center justify-center bg-gray-100">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-96 text-center">

    <h2 class="text-2xl font-bold text-gray-800 mb-4">
      Contact Details Submitted Successfully!
    </h2>

    <p class="text-gray-600 mb-2">
      <span class="font-semibold">Name:</span> {{ name }}
    </p>

    <p class="text-gray-600 mb-4">
      <span class="font-semibold">Email:</span> {{ email }}
    </p>

    <p class="text-gray-600 mb-4">
      <span class="font-semibold">Message:</span> {{ message }}
    </p>

    <a routerLink="/home" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">
      Go Back
    </a>

  </div>

</div>
